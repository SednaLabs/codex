      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
          fi

      - name: Reclaim runner disk headroom
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          hard_threshold_bytes=$((6 * 1024 * 1024 * 1024))

          available_bytes() {
            df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }

          before_bytes="$(available_bytes)"
          echo "Available disk before remote nextest replay cleanup: $(numfmt --to=iec "${before_bytes}")"

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          after_bytes="$(available_bytes)"
          echo "Available disk after remote nextest replay cleanup: $(numfmt --to=iec "${after_bytes}")"

          if [[ "${after_bytes}" -lt "${hard_threshold_bytes}" ]]; then
            echo "::error title=Insufficient runner disk::Available disk after cleanup is $(numfmt --to=iec "${after_bytes}"), below the 6 GiB safety floor for rust-ci-full remote nextest replay."
            exit 1
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: nextest@0.9.103

      - name: Download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-ci-full-nextest-archive-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up remote test env (Docker)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=codex-remote-test-env
          export CODEX_TEST_REMOTE_ENV_CARGO_TARGET_DIR="${RUNNER_TEMP}/remote-env-target"
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
          echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_ENV_CARGO_TARGET_DIR=${CODEX_TEST_REMOTE_ENV_CARGO_TARGET_DIR}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}" >> "$GITHUB_ENV"

      - name: Reclaim remote env build artifacts
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          hard_threshold_bytes=$((20 * 1024 * 1024 * 1024))

          available_bytes() {
            df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }

          before_bytes="$(available_bytes)"
          echo "Available disk before remote env artifact cleanup: $(numfmt --to=iec "${before_bytes}")"

          rm -rf "${CODEX_TEST_REMOTE_ENV_CARGO_TARGET_DIR:-${RUNNER_TEMP}/remote-env-target}"

          after_bytes="$(available_bytes)"
          echo "Available disk after remote env artifact cleanup: $(numfmt --to=iec "${after_bytes}")"

          if [[ "${after_bytes}" -lt "${hard_threshold_bytes}" ]]; then
            echo "::error title=Insufficient runner disk::Available disk after remote env artifact cleanup is $(numfmt --to=iec "${after_bytes}"), below the 20 GiB extraction safety floor for rust-ci-full remote nextest replay."
            exit 1
          fi

      - name: remote tests
        id: test
        shell: bash
        run: |
          set +e
          archive_file="${RUNNER_TEMP}/nextest-archive/rust-ci-full-nextest-${{ matrix.target }}-${{ matrix.profile }}.tar.zst"

      - name: Tear down remote test env
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set +e
          if [[ "${STEPS_TEST_OUTCOME}" != "success" ]]; then
            docker logs codex-remote-test-env || true
          fi
          docker rm -f codex-remote-test-env >/dev/null 2>&1 || true
        env:
          STEPS_TEST_OUTCOME: ${{ steps.test.outcome }}

      - name: Summarize remote nextest failures
        if: always()
        shell: bash
        run: |
          python3 "${{ github.workspace }}/.github/scripts/summarize_rust_ci_full.py" extract-nextest \
            --log "${RUNNER_TEMP}/nextest-remote.log" \
            --suite "remote-nextest-${{ matrix.target }}-${{ matrix.profile }}" \
            --output "${RUNNER_TEMP}/rust-ci-full-remote-nextest-summary.json"

      - name: Upload remote nextest summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-remote-nextest-summary-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rust-ci-full-remote-nextest-summary.json
          if-no-files-found: warn

      - name: verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. See logs for details."
          exit 1

  # --- Gatherer job for the full post-merge workflow --------------------------
  results:
    name: Full CI results
    needs:
      [
        general,
        cargo_shear,
        schedule_gate,
        matrix_plan,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
        lint_build,
        nextest_archive,
        tests,
        remote_tests,
      ]
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'workflow_run' ||
          (
            github.event.workflow_run.event == 'schedule' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
          )
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RUST_CI_FULL_CHECKOUT_REF }}

      - name: Download failure summaries
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rust-ci-full-*-summary-*
          merge-multiple: true
          path: ${{ runner.temp }}/rust-ci-full-summaries

      - name: Build structured summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          needs_json_file="${RUNNER_TEMP}/rust-ci-full-needs.json"
          summary_file="${RUNNER_TEMP}/rust-ci-full-summary.json"
          cat > "${needs_json_file}" <<'JSON'
          ${{ toJson(needs) }}
          JSON

          python3 "${{ github.workspace }}/.github/scripts/summarize_rust_ci_full.py" aggregate \
            --needs-json "$(cat "${needs_json_file}")" \
            --summary-dir "${RUNNER_TEMP}/rust-ci-full-summaries" \
            --checkout-ref "${RUST_CI_FULL_CHECKOUT_REF}" \
            --source-event "${RUST_CI_FULL_SOURCE_EVENT}" \
            --output "${summary_file}"

          python3 - "${summary_file}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("### rust-ci-full checkpoint summary")
          print()
          print(f"- Checkout ref: `{payload.get('checkout_ref', '')}`")
          print(f"- Source event: `{payload.get('source_event', '')}`")
          print("- Job results:")
          for job, result in sorted(payload.get("jobs", {}).items()):
              print(f"  - `{job}`: `{result}`")
          blockers = payload.get("primary_blockers") or []
          print(f"- Primary blockers: `{len(blockers)}`")
          for blocker in blockers[:10]:
              print(f"  - `{blocker.get('type')}`: `{json.dumps(blocker, sort_keys=True)}`")
          if len(blockers) > 10:
              print(f"  - `{len(blockers) - 10}` more blockers recorded in the summary artifact")
          PY

      - name: Upload full CI summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-summary
          path: ${{ runner.temp }}/rust-ci-full-summary.json
          if-no-files-found: warn

      - name: Verify full CI result
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local job="$1"
            local result="$2"
            [[ "${result}" == "success" ]] || {
              echo "${job} failed: ${result}"
              exit 1
            }
          }

          require_success_or_skipped() {
            local job="$1"
            local result="$2"
            [[ "${result}" == "success" || "${result}" == "skipped" ]] || {
              echo "${job} failed: ${result}"
              exit 1
            }
          }

          echo "source event: ${RUST_CI_FULL_SOURCE_EVENT}"
          echo "dedupe     : ${{ needs.schedule_gate.outputs.should_skip }}"
          echo "reason     : ${{ needs.schedule_gate.outputs.reason }}"
          echo "reuse      : ${{ needs.schedule_gate.outputs.matched_run_url }}"
          echo "argpkg      : ${{ needs.argument_comment_lint_package.result }}"
          echo "arglint     : ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general     : ${{ needs.general.result }}"
          echo "shear       : ${{ needs.cargo_shear.result }}"
          echo "matrix_plan : ${{ needs.matrix_plan.result }}"
          echo "lint        : ${{ needs.lint_build.result }}"
          echo "archive     : ${{ needs.nextest_archive.result }}"
          echo "tests       : ${{ needs.tests.result }}"
          echo "remote tests: ${{ needs.remote_tests.result }}"

          if [[ "${{ needs.schedule_gate.outputs.should_skip }}" == "true" ]]; then
            echo "Equivalent rust-ci-full run already passed for this branch and commit."
            echo "Reused run: ${{ needs.schedule_gate.outputs.matched_run_url }}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            require_success_or_skipped "argument_comment_lint_package" "${{ needs.argument_comment_lint_package.result }}"
            require_success_or_skipped "argument_comment_lint_prebuilt" "${{ needs.argument_comment_lint_prebuilt.result }}"
            require_success_or_skipped "general" "${{ needs.general.result }}"
            require_success_or_skipped "cargo_shear" "${{ needs.cargo_shear.result }}"
          else
            require_success "argument_comment_lint_package" "${{ needs.argument_comment_lint_package.result }}"
            require_success "argument_comment_lint_prebuilt" "${{ needs.argument_comment_lint_prebuilt.result }}"
            require_success "general" "${{ needs.general.result }}"
            require_success "cargo_shear" "${{ needs.cargo_shear.result }}"
          fi

          require_success "matrix_plan" "${{ needs.matrix_plan.result }}"
          require_success "lint_build" "${{ needs.lint_build.result }}"
          require_success "nextest_archive" "${{ needs.nextest_archive.result }}"
          require_success "tests" "${{ needs.tests.result }}"
          require_success "remote_tests" "${{ needs.remote_tests.result }}"

      - name: sccache summary note
        if: always()
        run: |
          echo "Per-job sccache stats are attached for sccache-enabled matrix jobs."

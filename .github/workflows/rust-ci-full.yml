name: rust-ci-full
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      platform_scope:
        description: Downstream platform coverage to run
        required: false
        type: choice
        options:
          - linux-x86_64-only
        default: linux-x86_64-only
  workflow_run:
    workflows: ["rust-ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  RUST_CI_FULL_CHECKOUT_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RUST_CI_FULL_SOURCE_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
  # Cargo's libgit2 transport has been flaky on macOS when fetching git
  # dependencies with nested submodules. Use the system git CLI, which has
  # better network/proxy behavior and matches Cargo's own suggested fallback.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  schedule_gate:
    name: Scheduled duplicate gate
    runs-on: ubuntu-24.04
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    outputs:
      should_run: ${{ steps.manual.outputs.should_run || steps.dedupe.outputs.should_run || 'false' }}
      should_skip: ${{ steps.manual.outputs.should_skip || steps.dedupe.outputs.should_skip || 'false' }}
      reason: ${{ steps.manual.outputs.reason || steps.dedupe.outputs.reason || '' }}
      matched_run_url: ${{ steps.dedupe.outputs.matched_run_url || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RUST_CI_FULL_CHECKOUT_REF }}

      - name: Allow deliberate manual checkpoint
        id: manual
        if: ${{ github.event_name != 'workflow_run' }}
        shell: bash
        run: |
          {
            echo "should_run=true"
            echo "should_skip=false"
            echo "reason=manual_checkpoint"
          } >> "$GITHUB_OUTPUT"

      - name: Check duplicate scheduled rust-ci-full success
        id: dedupe
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/skip_duplicate_workflow_run.py \
            --repo "${{ github.repository }}" \
            --workflow rust-ci-full.yml \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --head-sha "${{ github.event.workflow_run.head_sha }}" \
            --current-run-id "${{ github.run_id }}" \
            --github-output "${GITHUB_OUTPUT}"

  matrix_plan:
    name: Rust CI lane planner (informational)
    runs-on: ubuntu-24.04
    needs: schedule_gate
    if: >-
      ${{
        needs.schedule_gate.outputs.should_run == 'true'
      }}
    outputs:
      argument_comment_lint_matrix: ${{ steps.plan.outputs.argument_comment_lint_matrix }}
      lint_build_matrix: ${{ steps.plan.outputs.lint_build_matrix }}
      tests_matrix: ${{ steps.plan.outputs.tests_matrix }}
      remote_tests_matrix: ${{ steps.plan.outputs.remote_tests_matrix }}
    steps:
      - name: Compute platform matrices
        id: plan
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          # Downstream checkpoint coverage is intentionally Linux x86_64 only for now.
          linux_x86_64_arg_comment_lint = [
              {"name": "Linux x86_64", "runner": "ubuntu-24.04"},
          ]
          linux_x86_64_lint_build = [
              {
                  "runner": "ubuntu-24.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "profile": "dev",
              },
              {
                  "runner": "ubuntu-24.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "profile": "release",
              },
          ]

          linux_x86_64_tests = [
              {
                  "runner": "ubuntu-24.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "profile": "dev",
              }
          ]
          linux_x86_64_remote_tests = [
              {
                  "runner": "ubuntu-24.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "profile": "dev",
              }
          ]

          def emit(name: str, value: list[dict]) -> None:
              print(
                  f"{name}={json.dumps({'include': value}, separators=(',', ':'))}"
              )

          emit("argument_comment_lint_matrix", linux_x86_64_arg_comment_lint)
          emit("lint_build_matrix", linux_x86_64_lint_build)
          emit("tests_matrix", linux_x86_64_tests)
          emit("remote_tests_matrix", linux_x86_64_remote_tests)
          PY

  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Run typed failure diagnostic fixtures
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_ci_failure_diagnostic.py'
      - name: cargo fmt
        id: rustfmt
        shell: bash
        run: |
          set +e
          cargo fmt -- --config imports_granularity=Item --check 2>&1 | tee "${RUNNER_TEMP}/rustfmt.log"
          status=${PIPESTATUS[0]}
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"
      - name: Produce typed rustfmt diagnostic
        if: always()
        continue-on-error: true
        id: rustfmt_diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Format / etc
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/rust-ci-full-rustfmt-diagnostic.json
          SOURCE_SHA: ${{ env.RUST_CI_FULL_CHECKOUT_REF }}
          EXECUTION_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          JOB_NAME: ${{ github.job }}
        run: |
          set -euo pipefail
          job_url="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .html_url' 2>/dev/null | head -n 1 || true)"
          source_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/write_failure_diagnostic.py" \
            --output "${DIAGNOSTIC_OUTPUT}" \
            --repository "${REPOSITORY}" \
            --source-sha "${source_sha:-${SOURCE_SHA}}" \
            --execution-sha "${EXECUTION_SHA}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --event "${EVENT_NAME}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --run-url "${RUN_URL}" \
            --job "${JOB_NAME}" \
            --job-url "${job_url}" \
            --lane "rust-ci-full.general.rustfmt" \
            --outcome "${{ steps.rustfmt.outcome }}" \
            --exit-code "${{ steps.rustfmt.outputs.exit_status }}" \
            --diagnostic-kind rustfmt \
            --log-file "${RUNNER_TEMP}/rustfmt.log" \
            --reproducer-id cargo-fmt-check \
            --reproducer-args-json '{}'
      - name: Upload typed rustfmt diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-rustfmt-diagnostic
          path: ${{ runner.temp }}/rust-ci-full-rustfmt-diagnostic.json
          if-no-files-found: error
      - name: Rust benchmark smoke test
        run: just bench-smoke

  cargo_shear:
    name: cargo shear
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

  argument_comment_lint_package:
    name: Argument comment lint package
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: nightly-2025-09-18
          components: llvm-tools-preview, rustc-dev, rust-src
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    needs: matrix_plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_plan.outputs.argument_comment_lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ runner.os }}
      - name: Install Linux sandbox build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ runner.os != 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_extra_args=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            bazel_extra_args+=(--jobs=8 --loading_phase_threads=8)
          fi
          bazel_targets=()
          while IFS= read -r bazel_target; do
            bazel_targets+=("${bazel_target}")
          done < <(./tools/argument-comment-lint/list-bazel-targets.sh)
          ./.github/scripts/run-bazel-ci.sh \
            -- \
            build \
            --config=argument-comment-lint \
            "${bazel_extra_args[@]}" \
            --keep_going \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            -- \
            "${bazel_targets[@]}"
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ runner.os == 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-argument-comment-lint-bazel.sh \
            --config=argument-comment-lint \
            --platforms=//:local_windows \
            --keep_going \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: matrix_plan
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Speed up repeated builds across CI runs by caching compiled objects, except on
      # arm64 macOS runners cross-targeting x86_64 where ring/cc-rs can produce
      # mixed-architecture archives under sccache.
      USE_SCCACHE: ${{ (startsWith(matrix.runner, 'windows') || (matrix.runner == 'macos-15' && matrix.target == 'x86_64-apple-darwin')) && 'false' || 'true' }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_FALLBACK_CACHE_POLICY: restore-only
      # In rust-ci, representative release-profile checks use thin LTO for faster feedback.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.profile == 'release' && 'thin' || 'fat' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_plan.outputs.lint_build_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Ensure Rust target installed
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Explicit cache restore: split cargo home vs target, so we can
      # avoid caching the large target dir on the gnu-dev job.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      # Install and restore sccache cache
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: sccache

      - name: Configure sccache backend
        id: sccache_backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: bash "${{ github.workspace }}/.github/scripts/configure_sccache_backend.sh" "${SCCACHE_FALLBACK_CACHE_POLICY:-restore-only}"

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && steps.sccache_backend.outputs.backend == 'fallback' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Prepare APT cache directories (musl)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists
          sudo chown -R "$USER:$USER" /var/cache/apt /var/lib/apt/lists

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Restore APT cache (musl)
        id: cache_apt_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install musl build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Configure rustc UBSan wrapper (musl host)
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Clear sanitizer flags (musl)
        shell: bash
        run: |
          set -euo pipefail
          # Clear global Rust flags so host/proc-macro builds don't pull in UBSan.
          {
            echo "RUSTFLAGS="
            echo "CARGO_ENCODED_RUSTFLAGS="
            echo "RUSTDOCFLAGS="
          } >> "$GITHUB_ENV"
          # Override any runner-level Cargo config rustflags as well.
          {
            echo "CARGO_BUILD_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
          } >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"

      - if: ${{ !contains(matrix.target, 'windows') }}
        name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Install cargo-chef
        if: ${{ matrix.profile == 'release' }}
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-chef@0.1.71

      - name: Pre-warm dependency cache (cargo-chef)
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          RECIPE="${RUNNER_TEMP}/chef-recipe.json"
          cargo chef prepare --recipe-path "$RECIPE"
          cargo chef cook --recipe-path "$RECIPE" --target ${{ matrix.target }} --release --all-features

      - name: cargo clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} --all-features --tests --profile ${{ matrix.profile }} --timings -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/clippy.log"
          status=${PIPESTATUS[0]}
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Produce typed Clippy diagnostic
        if: always()
        continue-on-error: true
        id: clippy_diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/rust-ci-full-clippy-diagnostic-${{ matrix.target }}-${{ matrix.profile }}.json
          EXECUTION_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          JOB_NAME: ${{ github.job }}
        run: |
          set -euo pipefail
          job_url="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .html_url' 2>/dev/null | head -n 1 || true)"
          source_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/write_failure_diagnostic.py" \
            --output "${DIAGNOSTIC_OUTPUT}" \
            --repository "${REPOSITORY}" \
            --source-sha "${source_sha}" \
            --execution-sha "${EXECUTION_SHA}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --event "${EVENT_NAME}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --run-url "${RUN_URL}" \
            --job "${JOB_NAME}" \
            --job-url "${job_url}" \
            --lane "rust-ci-full.lint-build.clippy-${{ matrix.target }}-${{ matrix.profile }}" \
            --outcome "${{ steps.clippy.outcome }}" \
            --exit-code "${{ steps.clippy.outputs.exit_status }}" \
            --diagnostic-kind clippy \
            --log-file "${RUNNER_TEMP}/clippy.log" \
            --reproducer-id cargo-clippy \
            --reproducer-args-json '{"target":"${{ matrix.target }}","profile":"${{ matrix.profile }}"}'

      - name: Upload typed Clippy diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-clippy-diagnostic-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rust-ci-full-clippy-diagnostic-${{ matrix.target }}-${{ matrix.profile }}.json
          if-no-files-found: error

      - name: Summarize clippy failure
        if: always()
        shell: bash
        run: |
          python3 "${{ github.workspace }}/.github/scripts/summarize_rust_ci_full.py" extract-clippy \
            --log "${RUNNER_TEMP}/clippy.log" \
            --suite "clippy-${{ matrix.target }}-${{ matrix.profile }}" \
            --output "${RUNNER_TEMP}/rust-ci-full-clippy-summary.json"

      - name: Upload clippy summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-clippy-summary-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rust-ci-full-clippy-summary.json
          if-no-files-found: warn

      - name: Upload Cargo timings (clippy)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-clippy-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      # Save caches explicitly; make non-fatal so cache packaging
      # never fails the overall job. Only save when key wasn't hit.
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && steps.sccache_backend.outputs.backend == 'fallback' && steps.sccache_backend.outputs.policy == 'write-fallback'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }} (${{ matrix.profile }})";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save APT cache (musl)
        if: always() && !cancelled() && (matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl') && steps.cache_apt_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

  nextest_archive:
    name: Nextest archive — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: matrix_plan
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Archive creation is disk-bound on hosted Linux runners; skip local-disk
      # sccache here so the archive has maximum workspace headroom.
      USE_SCCACHE: "false"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
      CARGO_PROFILE_CI_TEST_STRIP: "symbols"

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_plan.outputs.tests_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
          fi

      - name: Reclaim runner disk headroom
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          hard_threshold_bytes=$((6 * 1024 * 1024 * 1024))

          available_bytes() {
            df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }

          before_bytes="$(available_bytes)"
          echo "Available disk before nextest archive cleanup: $(numfmt --to=iec "${before_bytes}")"

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          after_bytes="$(available_bytes)"
          echo "Available disk after nextest archive cleanup: $(numfmt --to=iec "${after_bytes}")"

          if [[ "${after_bytes}" -lt "${hard_threshold_bytes}" ]]; then
            echo "::error title=Insufficient runner disk::Available disk after cleanup is $(numfmt --to=iec "${after_bytes}"), below the 6 GiB safety floor for rust-ci-full nextest archives."
            exit 1
          fi

      # Some integration tests rely on DotSlash being installed.
      # See https://github.com/openai/codex/pull/7617.
      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target installed
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest@0.9.103

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build nextest archive
        shell: bash
        run: |
          set -euo pipefail
          archive_file="${RUNNER_TEMP}/rust-ci-full-nextest-${{ matrix.target }}-${{ matrix.profile }}.tar.zst"
          cargo nextest archive \
            --target ${{ matrix.target }} \
            --cargo-profile ci-test \
            --archive-file "${archive_file}"
          du -h "${archive_file}"

      - name: Upload Cargo timings (nextest)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-ci-full-nextest-archive-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rust-ci-full-nextest-${{ matrix.target }}-${{ matrix.profile }}.tar.zst
          if-no-files-found: error

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

  tests:
    name: Tests — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [matrix_plan, nextest_archive]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_plan.outputs.tests_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RUST_CI_FULL_CHECKOUT_REF }}
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
          fi

      - name: Reclaim runner disk headroom
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          hard_threshold_bytes=$((6 * 1024 * 1024 * 1024))

          available_bytes() {
            df --block-size=1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }

          before_bytes="$(available_bytes)"
          echo "Available disk before nextest replay cleanup: $(numfmt --to=iec "${before_bytes}")"

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          after_bytes="$(available_bytes)"
          echo "Available disk after nextest replay cleanup: $(numfmt --to=iec "${after_bytes}")"

          if [[ "${after_bytes}" -lt "${hard_threshold_bytes}" ]]; then
            echo "::error title=Insufficient runner disk::Available disk after cleanup is $(numfmt --to=iec "${after_bytes}"), below the 6 GiB safety floor for rust-ci-full nextest replay."
            exit 1
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: nextest@0.9.103

      - name: Download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-ci-full-nextest-archive-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Required for bubblewrap to work on Linux CI runners.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ can additionally gate unprivileged user namespaces
          # behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: tests
        id: test
        shell: bash
        run: |
          set +e
          archive_file="${RUNNER_TEMP}/nextest-archive/rust-ci-full-nextest-${{ matrix.target }}-${{ matrix.profile }}.tar.zst"
          cargo nextest run \
            --archive-file "${archive_file}" \
            --workspace-remap "${PWD}" \
            --no-fail-fast 2>&1 | tee "${RUNNER_TEMP}/nextest-normal.log"
          status=${PIPESTATUS[0]}
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"
        env:
          RUST_BACKTRACE: 1
          RUST_MIN_STACK: "8388608" # 8 MiB
          NEXTEST_STATUS_LEVEL: leak

      - name: Summarize nextest failures
        if: always()
        shell: bash
        run: |
          python3 "${{ github.workspace }}/.github/scripts/summarize_rust_ci_full.py" extract-nextest \
            --log "${RUNNER_TEMP}/nextest-normal.log" \
            --suite "nextest-${{ matrix.target }}-${{ matrix.profile }}" \
            --output "${RUNNER_TEMP}/rust-ci-full-nextest-summary.json"

      - name: Upload nextest summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-ci-full-nextest-summary-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rust-ci-full-nextest-summary.json
          if-no-files-found: warn

      - name: verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. See logs for details."
          exit 1

  remote_tests:
    name: Remote tests — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [matrix_plan, nextest_archive]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    strategy:

name: Native Windows Bazel health

on:
  # Keep the slower native Windows check as a post-merge health signal. The
  # required Bazel workflow still covers merge-queue and PR candidates.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect_diagnostics:
        description: Capture targeted native-Windows evidence even when the test passes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# The native x86 health job is the sole writer for its stable repository-cache
# key. The ARM64 selection analysis uses its own key and can publish only under
# the same trusted post-merge predicate; manual dispatches never receive cache-
# write eligibility.
concurrency:
  group: native-windows-bazel-health-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  analyze-windows-arm64-gnullvm-toolchain:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: Bazel aquery for aarch64-pc-windows-gnullvm Rust toolchain selection

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          # Keep this analysis cache distinct from the native x86 health key.
          # Its matching save below remains restricted to trusted post-merge
          # pushes by prepare-bazel-ci's repository cache write policy.
          target: aarch64-pc-windows-gnullvm
          cache-scope: bazel-${{ github.job }}

      - name: Assert ARM64 gnullvm Rust action-toolchain selection
        shell: bash
        run: |
          set -euo pipefail

          aquery_output="${RUNNER_TEMP}/aarch64-windows-gnullvm-aquery.txt"
          # `aquery` configures actions but does not execute build or test
          # actions. The target and extra execution platform together model
          # the ARM64 native Windows gnullvm selection contract.
          ./.github/scripts/run_bazel_with_buildbuddy.py \
            aquery \
            --platforms=@rules_rs//rs/platforms:aarch64-pc-windows-gnullvm \
            --extra_execution_platforms=@rules_rs//rs/platforms:aarch64-pc-windows-gnullvm \
            --extra_toolchains=//:windows_aarch64_gnullvm_rust_toolchain_for_health \
            --include_artifacts=true \
            --output=text \
            //codex-rs/otel:otel \
            >"${aquery_output}"

          # Validate one exact Rustc action block. Whole-output checks could
          # otherwise accept gnullvm text from an unrelated action.
          python3 .github/scripts/verify_arm64_gnullvm_aquery.py \
            "${aquery_output}" \
            --target //codex-rs/otel:otel

      # Preserve the exact action graph for diagnosis when verifier evidence
      # is insufficient. The artifact is limited to this run's ARM64 aquery
      # output and contains no environment, workspace, or secret material.
      - name: Upload ARM64 gnullvm aquery evidence
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-windows-arm64-aquery-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/aarch64-windows-gnullvm-aquery.txt
          if-no-files-found: error
          retention-days: 1

      # Keep the ARM64 analysis cache independent from the native x86 health
      # cache. `repository-cache-write-enabled` is true only for trusted push
      # runs on main or upstream-main, never for dispatches or untrusted refs.
      - name: Save ARM64 gnullvm aquery repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-native-main:
    # The full native test suite routinely takes 37-39 minutes on a warm
    # runner. Leave enough headroom for the explicitly supported D:/C:
    # non-Dev-Drive fallback and its cold Bazel repository cache.
    timeout-minutes: 90
    runs-on: windows-2022
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm (native health)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          # Keep the former job identity in the scope so post-merge restores
          # continue to use the existing native repository-cache key.
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        id: native_bazel_test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            # Native gnullvm proc macros require the matching gnullvm Rust
            # execution toolchain so their DLL runtime remains loadable.
            --modify_execution_info=Rustc=+no-remote-cache
            # Keep Windows test actions serialized; the host-global native
            # runtime and timer-sensitive tests are not safe under fan-out.
            --local_test_jobs=1
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      # A diagnostic dispatch reruns only the PTY unit-test target with Bazel
      # success output retained and Rust/libtest output uncaptured. The normal
      # whole-suite health invocation above remains unchanged; this bounded
      # path makes the test-scoped ConPTY markers available for evidence.
      - name: Run targeted ConPTY diagnostics
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.collect_diagnostics }}
        id: conpty_diagnostics
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          diagnostic_dir="${RUNNER_TEMP}/native-windows-bazel-diagnostics"
          mkdir -p "${diagnostic_dir}"
          diagnostic_log="${diagnostic_dir}/pty-unit-tests-output.log"

          set +e
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            -- \
            test \
            --cache_test_results=no \
            --test_output=all \
            --test_arg=--nocapture \
            --modify_execution_info=Rustc=+no-remote-cache \
            --local_test_jobs=1 \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA="${GITHUB_SHA}" \
            --build_metadata=TAG_windows_native_conpty_diagnostics=true \
            -- \
            //codex-rs/utils/pty:pty-unit-tests \
            2>&1 | tee "${diagnostic_log}"
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "${test_status}" -ne 0 ]]; then
            echo "Targeted ConPTY diagnostic test failed with exit code ${test_status}." >&2
            exit "${test_status}"
          fi

          required_markers=(
            '[conpty-diagnostic] label='
            'phase=child-command bytes='
            'phase=child-command enqueue=accepted'
            'phase=input bytes='
            'phase=input enqueue=accepted'
            'writer input raw_len='
            'writer results write='
            'terminal_marker_match=true'
          )
          missing_markers=0
          for marker in "${required_markers[@]}"; do
            if ! grep -Fq "${marker}" "${diagnostic_log}"; then
              echo "Missing required ConPTY diagnostic marker: ${marker}" >&2
              missing_markers=1
            fi
          done
          if [[ "${missing_markers}" -ne 0 ]]; then
            echo "Targeted ConPTY diagnostics produced no complete positive evidence set." >&2
            exit 1
          fi

      # The test remains fail-fast. This evidence path runs after a failure, or
      # when an operator explicitly asks for a diagnostic dispatch; it does not
      # turn a failing native test into a successful health result.
      - name: Collect native Windows Bazel diagnostics
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.collect_diagnostics) }}
        shell: pwsh
        run: >-
          ./.github/scripts/collect-native-windows-bazel-diagnostics.ps1
          -OutputDirectory "${{ runner.temp }}/native-windows-bazel-diagnostics"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-gnullvm
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Upload native Windows Bazel diagnostics
        if: ${{ always() && !cancelled() && (failure() || (github.event_name == 'workflow_dispatch' && inputs.collect_diagnostics)) }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-windows-bazel-diagnostics
          path: ${{ runner.temp }}/native-windows-bazel-diagnostics
          if-no-files-found: warn
          retention-days: 3

      # This serialised health job is the sole trusted writer for its effective
      # cache key. Keep the cache service non-fatal: a cache outage must not
      # mask the native Bazel health result.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.prepare_bazel.outputs.repository-cache-write-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

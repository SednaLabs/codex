name: sedna-release-install

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Sedna release tag to install
        required: true
        type: string
      dry_run:
        description: Verify assets without changing the installed binary; public workflow requires true
        required: false
        default: true
        type: boolean
      allow_prerelease:
        description: Permit installing a GitHub prerelease when explicitly dispatched
        required: false
        default: false
        type: boolean
      require_linux_arm64:
        description: Require and verify the Linux Arm64 asset set; disable only for historical x86-only releases
        required: false
        default: true
        type: boolean
      macos_release_mode:
        description: Intel macOS asset kind expected on the release
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - preview
          - unnotarized
          - notarized

permissions:
  contents: read
  attestations: read

concurrency:
  group: sedna-release-install
  cancel-in-progress: false

jobs:
  plan:
    name: Select release verification platforms
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Require exact release-tag workflow ref
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${RELEASE_TAG}"
          if [[ "${EVENT_REF}" != "${expected_ref}" ]]; then
            echo "Release verification must run from ${expected_ref}; workflow ref is ${EVENT_REF}."
            exit 1
          fi

      - name: Validate x86-only compatibility request
        if: ${{ !inputs.require_linux_arm64 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          asset_names="${RUNNER_TEMP}/sedna-release-asset-names.txt"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > "${asset_names}"
          arm_asset="$(grep -- '-aarch64-unknown-linux-gnu' "${asset_names}" || true)"
          if [[ -n "${arm_asset}" ]]; then
            echo "require_linux_arm64=false is only valid for historical releases without Arm64 assets; found ${arm_asset}."
            exit 1
          fi

      - name: Build verification matrix
        id: matrix
        shell: bash
        env:
          MACOS_RELEASE_MODE: ${{ inputs.macos_release_mode }}
          REQUIRE_LINUX_ARM64: ${{ inputs.require_linux_arm64 }}
        run: |
          set -euo pipefail
          matrix='[{"platform":"Linux x64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]'
          if [[ "${REQUIRE_LINUX_ARM64}" == "true" ]]; then
            matrix="$(
              jq -cn \
                --argjson linux "${matrix}" \
                '$linux + [{"platform":"Linux Arm64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]'
            )"
          fi
          if [[ "${MACOS_RELEASE_MODE}" != "off" ]]; then
            matrix="$(
              jq -cn \
                --argjson linux "${matrix}" \
                '$linux + [{"platform":"Intel macOS x64","runner":"macos-15-intel","target":"x86_64-apple-darwin"}]'
            )"
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  install:
    name: Verify published Sedna release assets (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out installer
        uses: actions/checkout@v7

      - name: Resolve requested release
        id: request
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
        run: |
          set -euo pipefail

          if [[ "$(printf '%s' "${EVENT_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" != "sednalabs/codex" ]]; then
            echo "This workflow only installs sednalabs/codex releases."
            exit 1
          fi

          release_tag="${INPUT_RELEASE_TAG}"
          dry_run="${INPUT_DRY_RUN}"
          allow_prerelease="${INPUT_ALLOW_PRERELEASE:-false}"

          if [[ "${dry_run}" != "true" ]]; then
            echo "This public workflow verifies release assets only; host-local installs must run through external deployment automation."
            exit 1
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?-sedna\.[0-9]+(\+upstream\.[0-9]+)?$ ]]; then
            echo "Release tag must look like v0.124.0-sedna.2 or v0.126.0-alpha.5-sedna.1+upstream.1; got ${release_tag}."
            exit 1
          fi

          {
            echo "release_tag=${release_tag}"
            echo "dry_run=${dry_run}"
            echo "allow_prerelease=${allow_prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ runner.os == 'Linux' && inputs.require_linux_arm64 }}
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Verify release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
          ALLOW_PRERELEASE: ${{ steps.request.outputs.allow_prerelease }}
          MACOS_RELEASE_MODE: ${{ inputs.macos_release_mode }}
          REQUIRE_LINUX_ARM64: ${{ inputs.require_linux_arm64 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          set --
          if [[ "${ALLOW_PRERELEASE}" == "true" ]]; then
            set -- "$@" --allow-prerelease
          fi

          if [[ "${MACOS_RELEASE_MODE}" == "preview" ]]; then
            set -- "$@" --macos-preview
          fi
          if [[ "${MACOS_RELEASE_MODE}" == "unnotarized" ]]; then
            set -- "$@" --macos-unnotarized
          fi

          if [[ "${REQUIRE_LINUX_ARM64}" == "true" && "${TARGET}" == *-unknown-linux-gnu ]]; then
            set -- "$@" --verify-signatures --verify-attestation
          fi

          if [[ "${REQUIRE_LINUX_ARM64}" != "true" && "${TARGET}" == "x86_64-unknown-linux-gnu" ]]; then
            set -- "$@" --allow-historical-x86
          fi

          scripts/install_sedna_release_asset \
            --repository "${GITHUB_REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --dry-run \
            "$@"

      - name: Summarize
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
          ALLOW_PRERELEASE: ${{ steps.request.outputs.allow_prerelease }}
          MACOS_RELEASE_MODE: ${{ inputs.macos_release_mode }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "## Sedna release install"
            echo
            echo "- Release tag: ${RELEASE_TAG:-unknown}"
            echo "- Mode: public asset verification"
            echo "- Platform: ${PLATFORM}"
            echo "- Target: ${TARGET}"
            echo "- Allow prerelease: ${ALLOW_PRERELEASE:-unknown}"
            echo "- Intel macOS mode: ${MACOS_RELEASE_MODE:-off}"
            echo "- Host-local install: external deployment path"
          } >> "$GITHUB_STEP_SUMMARY"
